# Photos & Videos: after photos, videos (or captions.yml) are uploaded to gallery/, make the web-size
# copies and assets/gallery/gallery.json with tools/build_gallery.py, commit them to main, and ask
# GitHub Pages to republish the site. Runs are listed under the repository's "Actions" tab.
name: Gallery photos

on:
  push:
    branches: [main]
    paths:
      - 'gallery/**'
      - 'tools/build_gallery.py'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: gallery
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the image tools
        run: python -m pip install --disable-pip-version-check "pillow>=10" "pyyaml>=6" "pillow-heif>=0.16"

      - name: Install ffmpeg (only when video files were uploaded)
        run: |
          if find gallery -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.m4v' -o -iname '*.webm' -o -iname '*.avi' -o -iname '*.mkv' -o -iname '*.3gp' \) -print -quit | grep -q .; then
            command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
            ffmpeg -hide_banner -version | head -1
          else
            echo "No video files in gallery/."
          fi

      - name: Make the web-size photos, videos and gallery.json
        run: python tools/build_gallery.py

      - name: Commit the results
        id: commit
        run: |
          git add -A assets/gallery
          if git diff --cached --quiet; then
            echo "The gallery is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Gallery: update web-size photos"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      # Pages normally rebuilds on its own after the push; this request makes sure it does.
      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" --silent
